[package]
name = "vr"
description = "OpenXR stereo backend: runs the wgpu renderer against a VR runtime"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
log.workspace = true
wgpu.workspace = true
wgpu-hal = { version = "30", features = ["metal"] }
openxr-sys = "0.13.1"
objc2 = "0.6.4"
objc2-metal = { version = "0.3.2", default-features = false, features = [
    "std",
    "MTLAllocation",
    "MTLCommandQueue",
    "MTLDevice",
    "MTLPixelFormat",
    "MTLTexture",
] }
libloading = "0.8.9"

[dev-dependencies]
objc2-metal = { version = "0.3.2", default-features = false, features = ["MTLBuffer"] }
