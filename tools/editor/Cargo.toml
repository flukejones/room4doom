[package]
name = "editor"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "ReDoomEd-style Doom map editor (GPUI)"

[dependencies]
argh.workspace = true
bincode.workspace = true
bytemuck = { workspace = true, features = ["derive"] }
colorous.workspace = true
opaline.workspace = true
dirs.workspace = true
png.workspace = true
rbsp.workspace = true
editor-core.workspace = true
log.workspace = true
math.workspace = true
rfd.workspace = true
ron.workspace = true
serde.workspace = true
simplelog.workspace = true
gpui.workspace = true
ui-common.workspace = true
image.workspace = true
wgpu.workspace = true
pollster.workspace = true
async-channel = "2"
wad.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-core-foundation = "0.3"
objc2-core-video = "0.3"
objc2-metal = "0.3"
wgpu-hal = { version = "30", features = ["metal"] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
test-utils.workspace = true
[lints]
workspace = true
